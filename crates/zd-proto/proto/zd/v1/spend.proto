syntax = "proto3";

package zd.v1;

import "zd/v1/common.proto";

// Spends travel as PCZTs (ZIP 374). Wallet state runs Creator, Constructor,
// IO Finalizer and Updater, then sends the same PCZT to a prover and to the
// signers in parallel; v6 transactions let signing happen before the anchor
// and witnesses are fixed.

// Any 1 of n provers. A prover receives the account FVK and full note data
// inside the PCZT, so provers must be inside the customer's trust boundary.
service Prover {
  rpc Prove(ProveJob) returns (ProveResult);
}

message ProveJob {
  bytes job_id = 1;
  AccountRef account = 2;
  // PCZT with fvk, witness and anchor set for every spend.
  bytes pczt = 3;
  uint64 deadline_unix_ms = 4;
}

message ProveResult {
  bytes job_id = 1;
  oneof outcome {
    // The PCZT with Ironwood / Orchard proofs attached.
    bytes proved_pczt = 2;
    string error = 3;
  }
  uint64 prove_time_ms = 4;
}

// A 1/1 signer, or the coordinator of a FROST quorum (which drives the
// FrostParticipant rounds below). Wallet state only ever talks to this.
service Signer {
  rpc Sign(SignJob) returns (SignResult);
}

message SignJob {
  bytes job_id = 1;
  AccountRef account = 2;
  // Redacted PCZT: no witnesses, but values, recipients and alphas present so
  // each signer can run the Verifier role and its own policy.
  bytes pczt = 3;
  // Optional human-readable reason shown to approvers.
  string memo = 4;
}

message SignResult {
  bytes job_id = 1;
  oneof outcome {
    bytes signed_pczt = 2;
    string rejected_reason = 3;
  }
}

// One FROST quorum member. The coordinator (the Signer service of a FROST
// account) calls Commit on every member, picks `threshold` of those that
// agreed, then calls Sign on exactly those. Each member checks the PCZT and
// runs its own policy in Commit, before any nonce exists, and binds its nonces
// to the PCZT's sighash and each spend's alpha; Sign refuses anything else.
service FrostParticipant {
  rpc Commit(FrostCommitRequest) returns (FrostCommitResponse);
  rpc Sign(FrostSignRequest) returns (FrostSignResponse);
}

message FrostCommitRequest {
  bytes job_id = 1;
  AccountRef account = 2;
  // Redacted PCZT, as in SignJob.
  bytes pczt = 3;
  string memo = 4;
}

message FrostCommitResponse {
  bytes job_id = 1;
  // This member's FROST identifier (serialized, 32 bytes).
  bytes identifier = 2;
  oneof outcome {
    FrostCommitments commitments = 3;
    string rejected_reason = 4;
  }
}

message FrostCommitments {
  // One serialized frost SigningCommitments per spend, in the order of the
  // spends the member found (Orchard pool first, then by action index).
  repeated bytes per_spend = 1;
  // BLAKE2b-256 of the shielded sighash, so the coordinator can check that
  // every member is signing the same transaction.
  bytes sighash_digest = 2;
}

message FrostSignRequest {
  bytes job_id = 1;
  AccountRef account = 2;
  // One serialized frost SigningPackage per spend, same order as commitments.
  repeated bytes signing_packages = 3;
}

message FrostSignResponse {
  bytes job_id = 1;
  oneof outcome {
    FrostShares shares = 2;
    string rejected_reason = 3;
  }
}

message FrostShares {
  // One serialized frost SignatureShare per spend.
  repeated bytes per_spend = 1;
}
