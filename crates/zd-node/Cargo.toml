[package]
name = "zd-node"
version = "0.1.0"
description = "The `zd` binary: every role of a disaggregated Orchard-protocol wallet as a subcommand"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "zd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
hex = "0.4"
orchard = { workspace = true, features = ["circuit"] }
prost.workspace = true
rand = { workspace = true, features = ["sys_rng"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "fs"] }
toml = "0.8"
tonic = { workspace = true, features = ["tls-ring", "tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zcash_client_backend = { version = "0.25", default-features = false, features = ["lightwalletd-tonic-transport"] }
zcash_protocol = { version = "0.11", features = ["local-consensus"] }
zd-address = { path = "../zd-address" }
zd-detect = { path = "../zd-detect" }
zd-frost = { path = "../zd-frost" }
zd-proto = { path = "../zd-proto" }
zd-services = { path = "../zd-services" }
zd-wallet = { path = "../zd-wallet" }
zeroize.workspace = true

[dev-dependencies]
tempfile = "3"
